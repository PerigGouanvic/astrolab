<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>astrolab — carte natale</title>
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <main>
    <header>
      <h1 id="chart-title">Maintenant</h1>
      <p id="chart-info" class="chart-info"></p>
      <nav class="controls">
        <button type="button" data-mode="now" class="active">maintenant</button>
        <button type="button" data-mode="natal">natal (Perig)</button>
        <button type="button" id="proxy-settings" class="proxy-btn" title="Configurer le proxy CORS pour astéroïdes">⚙</button>
      </nav>
      <nav class="layers" aria-label="Couches visibles">
        <label class="layer"><input type="checkbox" data-layer="signs" checked> signes</label>
        <label class="layer"><input type="checkbox" data-layer="houses" checked> maisons</label>
        <label class="layer"><input type="checkbox" data-layer="planets" checked> planètes</label>
        <label class="layer"><input type="checkbox" data-layer="midpoints"> mi-points</label>
        <label class="layer"><input type="checkbox" data-layer="asteroids" checked> astéroïdes</label>
        <label class="layer"><input type="checkbox" data-layer="aspects"> aspects</label>
        <label class="layer"><input type="checkbox" data-layer="harmonics"> harmoniques 5·7</label>
      </nav>
      <details class="config">
        <summary>configuration</summary>
        <div class="config-body">
          <label class="config-row">
            <span>Aspects :</span>
            <select data-config="aspectStyle">
              <option value="lines">lignes</option>
              <option value="digits">chiffres harmoniques</option>
            </select>
          </label>
        </div>
      </details>
      <div class="asteroid-search-wrap">
        <input id="asteroid-search" type="text" placeholder="astéroïde par nom ou n° MPC…" autocomplete="off">
        <div id="asteroid-dropdown" class="asteroid-dropdown" hidden></div>
      </div>
      <div id="asteroid-chips" class="asteroid-chips"></div>
    </header>
    <div id="chart-container">
      <svg id="chart" viewBox="-520 -520 1040 1040" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <section id="chart-data" class="chart-data"></section>
    <pre id="error-box" class="error-box" hidden></pre>
  </main>
  <script type="module" src="app.js?v=12"></script>
</body>
</html>
