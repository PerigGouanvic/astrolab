<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>astrolab — carte natale</title>
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
  <main>
    <header>
      <h1 id="chart-title">Maintenant</h1>
      <p id="chart-info" class="chart-info"></p>
      <nav class="controls">
        <button type="button" data-mode="now" class="active">maintenant</button>
        <button type="button" data-mode="natal">natal (Perig)</button>
        <button type="button" id="proxy-settings" class="proxy-btn" title="Configurer le proxy CORS pour astéroïdes">⚙</button>
      </nav>
      <p class="scrap-hint">Double-tap sur le chart pour ajouter au scrapbook</p>
      <nav class="layers" aria-label="Couches visibles">
        <label class="layer"><input type="checkbox" data-layer="signs" checked> signes</label>
        <label class="layer"><input type="checkbox" data-layer="houses" checked> maisons</label>
        <label class="layer"><input type="checkbox" data-layer="planets" checked> planètes</label>
        <label class="layer"><input type="checkbox" data-layer="midpoints"> mi-points</label>
        <label class="layer"><input type="checkbox" data-layer="asteroids" checked> astéroïdes</label>
        <label class="layer"><input type="checkbox" data-layer="scrapbook" checked> scrapbook</label>
        <div class="aspects-menu">
          <button type="button" class="aspects-toggle" aria-expanded="false" aria-haspopup="true">
            aspects <span class="aspects-summary">—</span> <span aria-hidden="true">▾</span>
          </button>
          <div class="aspects-panel" hidden role="menu">
            <button type="button" class="aspects-close" aria-label="Fermer">×</button>
            <div class="panel-row">
              <span class="panel-label">affichage :</span>
              <div class="segmented" role="radiogroup" aria-label="Style de rendu">
                <button type="button" data-aspect-style="lines">ligne</button>
                <button type="button" data-aspect-style="digits">chiffre</button>
              </div>
            </div>
            <div class="panel-label">harmoniques :</div>
            <div class="harmonics-grid" role="group" aria-label="Harmoniques activées">
              <label class="harmonic-chip"><input type="checkbox" data-harmonic="1"><span>1</span></label>
              <label class="harmonic-chip"><input type="checkbox" data-harmonic="2"><span>2</span></label>
              <label class="harmonic-chip"><input type="checkbox" data-harmonic="3"><span>3</span></label>
              <label class="harmonic-chip"><input type="checkbox" data-harmonic="4"><span>4</span></label>
              <label class="harmonic-chip"><input type="checkbox" data-harmonic="5"><span>5</span></label>
              <label class="harmonic-chip"><input type="checkbox" data-harmonic="6"><span>6</span></label>
              <label class="harmonic-chip"><input type="checkbox" data-harmonic="7"><span>7</span></label>
              <label class="harmonic-chip"><input type="checkbox" data-harmonic="8"><span>8</span></label>
              <label class="harmonic-chip"><input type="checkbox" data-harmonic="9"><span>9</span></label>
            </div>
          </div>
        </div>
      </nav>
      <details class="config">
        <summary>configuration</summary>
        <div class="config-body config-empty">
          (aucune option pour le moment)
        </div>
      </details>
      <div class="asteroid-search-wrap">
        <input id="asteroid-search" type="text" placeholder="astéroïde par nom ou n° MPC…" autocomplete="off">
        <div id="asteroid-dropdown" class="asteroid-dropdown" hidden></div>
      </div>
      <div id="asteroid-chips" class="asteroid-chips"></div>
    </header>
    <div id="chart-container">
      <svg id="chart" viewBox="-520 -520 1040 1040" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <section id="chart-data" class="chart-data"></section>
    <pre id="error-box" class="error-box" hidden></pre>
  </main>
  <!-- Backdrop rendu au niveau body pour éviter tout containing block cassé
       par un ancêtre transformé/positionné. Toggle par JS quand le popup
       aspects est ouvert. -->
  <div class="aspects-backdrop" hidden aria-hidden="true"></div>

  <script type="module" src="app.js?v=21"></script>
</body>
</html>
